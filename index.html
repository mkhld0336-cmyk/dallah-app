<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>ديربي أرينا الملكي | YouTube Streamer Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#0b0b0d;--bg-panel:#141419;--bg-card:#1a1814;
  --gold:#d4af37;--gold-gradient:linear-gradient(135deg,#bf953f,#fcf6ba 25%,#b38728 50%,#fbf5b7 75%,#aa771c);
  --neon:#38bdf8;--danger:#ef4444;--green:#22c55e;--purple:#a855f7;
  --text:#f5f5f7;--muted:#a1a1a6;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ================= 16:9 STREAM LAYOUT ================= */
.stream-layout { display: flex; flex: 1; width: 100%; height: 100vh; overflow: hidden; }
.sidebar { width: 20%; min-width: 250px; background: rgba(20,20,25,0.95); border-inline: 1px solid var(--gold-dim); display: flex; flex-direction: column; padding: 10px; z-index: 10; }
.center-area { flex: 1; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at center, #1f1b13, #0b0b0d); overflow: hidden; }

/* Hides sidebars on mobile (so shorts recording remains clean) */
@media (max-width: 900px) {
  .sidebar { display: none !important; }
  .stream-layout { flex-direction: column; }
}

/* Top Goal Bar */
.goal-bar-container { width: 100%; padding: 10px 20px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--gold-dim); z-index: 15; text-align: center; }
.goal-text { font-size: 14px; font-weight: bold; color: var(--gold); margin-bottom: 5px; text-shadow: 0 0 10px rgba(212,175,55,0.5); }
.goal-progress-bg { width: 100%; height: 12px; background: #1e293b; border-radius: 10px; overflow: hidden; border: 1px solid #334155; }
.goal-progress-fill { height: 100%; width: 0%; background: var(--gold-gradient); transition: width 0.3s ease; box-shadow: 0 0 15px var(--gold); }

/* Arena */
.arena-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; padding: 10px; }
canvas { background: #000; border-radius: 50%; box-shadow: 0 0 60px rgba(212,175,55,.2),inset 0 0 50px rgba(56,189,248,.3); max-width: 100%; max-height: 100%; aspect-ratio: 1; z-index: 5;}

/* Sidebars Content */
.sidebar-title { font-size: 14px; font-weight: 900; color: var(--gold); margin-bottom: 10px; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 5px; }
.chat-msg { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 8px; margin-bottom: 5px; font-size: 12px; border-right: 3px solid var(--neon); animation: slideUp .3s; }
.chat-msg b { color: var(--gold); }
@keyframes slideUp { from{transform:translateY(10px);opacity:0} to{transform:translateY(0);opacity:1} }
.leaderboard-item { display: flex; justify-content: space-between; font-size: 13px; padding: 8px; border-bottom: 1px dashed #334155; }
.leaderboard-item span:first-child { color: var(--neon); font-weight: bold; }
.leaderboard-item span:last-child { color: var(--gold); font-weight: 900; }

/* Streamer Control Panel (Hidden by default) */
.streamer-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10,10,15,0.95); border: 2px solid var(--gold); border-radius: 15px; padding: 20px; z-index: 9999; display: none; flex-direction: column; gap: 10px; width: 300px; box-shadow: 0 0 50px rgba(212,175,55,0.3); text-align: center;}
.streamer-panel h3 { color: var(--gold); margin-bottom: 10px; }
.sc-btn { padding: 12px; border-radius: 10px; font-weight: 900; font-family: inherit; color: #fff; cursor: pointer; border: none; display: flex; justify-content: space-between; align-items: center; }
.sc-btn:active { transform: scale(0.95); }
.sc-btn.bomb { background: linear-gradient(135deg, #a855f7, #6b21a8); }
.sc-btn.strike { background: linear-gradient(135deg, #38bdf8, #0284c7); }
.sc-btn.gold { background: linear-gradient(135deg, #d4af37, #aa771c); color: #000; }

/* Bottom Controls */
.controls { padding: 10px; background: rgba(20,20,25,0.9); border-top: 1px solid var(--gold-dim); display: flex; gap: 10px; z-index: 20; }
.btn-main { flex: 1; padding: 12px; border-radius: 10px; font-weight: 900; font-size: 14px; background: var(--gold-gradient); color: #0b0b0d; border: none; }
.btn-sec { padding: 12px; border-radius: 10px; font-weight: 700; background: var(--bg-card); color: var(--text); border: 1px solid #334155; }

/* Toast */
.toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 2000; pointer-events: none; width: 90%; max-width: 400px; }
.toast { background: rgba(20,20,25,.95); border: 1px solid var(--gold); color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 700; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,.6); animation: fadeInOut 3s forwards; }
@keyframes fadeInOut { 0%{opacity:0;transform:translateY(-20px)} 15%{opacity:1;transform:translateY(0)} 85%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-20px)} }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- STREAMER SECRET PANEL -->
<div class="streamer-panel" id="streamerPanel">
  <h3>🎛️ لوحة تحكم المذيع (Super Chat)</h3>
  <button class="sc-btn bomb" onclick="triggerBlackHole()"><span>☄️ ثقب أسود</span><span>$10+</span></button>
  <button class="sc-btn strike" onclick="triggerLightning()"><span>⚡ صاعقة</span><span>$5+</span></button>
  <button class="sc-btn gold" onclick="triggerWhaleDrop('داعم ملكي')"><span>💰 مطر ذهب</span><span>$1+</span></button>
  <button class="btn-sec" style="margin-top:10px;" onclick="document.getElementById('streamerPanel').style.display='none'">إغلاق</button>
</div>

<div class="stream-layout">
  <!-- LEFT SIDEBAR (Leaderboard) -->
  <div class="sidebar">
    <div class="sidebar-title">🏆 المتصدرون</div>
    <div class="leaderboard-item"><span>الرياض</span> <span>1250</span></div>
    <div class="leaderboard-item"><span>جدة</span> <span>980</span></div>
    <div class="leaderboard-item"><span>الدمام</span> <span>750</span></div>
    <div class="leaderboard-item" id="playerRankBox"><span>قائد</span> <span id="playerRankScore">0</span></div>
    
    <div class="sidebar-title" style="margin-top:20px;">🌪️ مؤشر الفوضى</div>
    <div style="width:100%; height:10px; background:#1e293b; border-radius:5px; overflow:hidden;">
      <div id="chaosMeter" style="width:20%; height:100%; background:var(--danger); transition:width 0.5s;"></div>
    </div>
    <p style="font-size:10px; color:var(--muted); margin-top:5px; text-align:center;">كلما زادت الفوضى، زادت الأرباح!</p>
  </div>

  <!-- CENTER AREA (Game) -->
  <div class="center-area">
    <div class="goal-bar-container">
      <div class="goal-text" id="goalText">الهدف القادم: قنبلة الفيزياء عند 1000 لايك (0/1000)</div>
      <div class="goal-progress-bg"><div class="goal-progress-fill" id="goalProgress"></div></div>
    </div>

    <div class="arena-container">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="controls">
      <button class="btn-main" id="startBtn" onclick="GameEngine.startBattle()">▶ ابدأ البث</button>
      <button class="btn-sec" onclick="GameEngine.resetGame()">↺ تصفير</button>
      <!-- Secret Button to open Streamer Panel -->
      <button class="btn-sec" onclick="document.getElementById('streamerPanel').style.display='flex'" title="لوحة المذيع">🎛️</button>
    </div>
  </div>

  <!-- RIGHT SIDEBAR (Live Chat) -->
  <div class="sidebar">
    <div class="sidebar-title">💬 الشات المباشر</div>
    <div id="liveChatBox" style="flex:1; overflow-y:hidden; display:flex; flex-direction:column; justify-content:flex-end;">
      <!-- Chat messages injected here -->
    </div>
  </div>
</div>

<script>
'use strict';
// (Game Logic - Physics & Audio)
const AudioFX = { ctx:null, init(){ if(!this.ctx) this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended')this.ctx.resume(); }, play(f,t,d,v){ try{ this.init(); if(!this.ctx)return; const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=t; o.frequency.setValueAtTime(f,this.ctx.currentTime); g.gain.setValueAtTime(v,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+d); o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+d); }catch(e){} }, hit(){this.play(300,'triangle',.1,.08)}, elim(){this.play(120,'sawtooth',.3,.15)}, win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.play(f,'sine',.25,.12),i*140))}, bass(){this.play(40,'sine',1.5,.4)}, click(){this.play(600,'sine',.04,.04)} };

const Config={MAX_BALLS:20,ARENA_RADIUS_RATIO:.44,BALL_RADIUS_RATIO:.055,FRICTION:.988,HOLE_PULL:.25,MAX_VELOCITY:16,EPSILON:.0001};
const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
let Arena={cx:0,cy:0,radius:0}, Balls=[], Holes=[], Particles=[], FanAngle=0, lastTime=performance.now(), ScreenShake=0, HitStop=0;
let CurrentState = 'LOBBY';
let playerKills=0;

function resizeCanvas(){ const c=canvas.parentElement; const s=Math.min(c.clientWidth-20,c.clientHeight-20,480); canvas.width=s*window.devicePixelRatio; canvas.height=s*window.devicePixelRatio; canvas.style.width=s+'px'; canvas.style.height=s+'px'; ctx.setTransform(window.devicePixelRatio,0,0,window.devicePixelRatio,0,0); Arena.cx=s/2;Arena.cy=s/2;Arena.radius=s*Config.ARENA_RADIUS_RATIO; setupHoles(); }
window.addEventListener('resize',resizeCanvas);

function setupHoles(){ Holes=[]; const hr=Math.max(12,Arena.radius*.11); const dist=Arena.radius*.64; for(let i=0;i<6;i++){ const a=(i*Math.PI*2)/6; Holes.push({x:Arena.cx+Math.cos(a)*dist,y:Arena.cy+Math.sin(a)*dist,r:hr}); } }

function createBall(name,isPlayer=false){ const br=Math.max(10,Arena.radius*Config.BALL_RADIUS_RATIO); let safe, tries=0; do{ const a=Math.random()*Math.PI*2,d=Math.random()*(Arena.radius*.4); safe={x:Arena.cx+Math.cos(a)*d, y:Arena.cy+Math.sin(a)*d}; tries++; }while(tries<20 && Holes.some(h=>Math.hypot(h.x-safe.x,h.y-safe.y)<h.r+br+10)); const b={ id:Math.random().toString(36).substr(2,6),name,x:safe.x,y:safe.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,r:br,color:isPlayer?'#d4af37':`hsl(${Math.random()*360},75%,55%)`,alive:true,shield:false,isPlayer }; Balls.push(b); return true; }

function updatePhysics(dt){
  if(CurrentState!=='BATTLE')return;
  if(HitStop>0){HitStop--;return}
  Balls.forEach(b=>{
    if(!b.alive)return;
    b.vx*=Math.pow(Config.FRICTION,dt*60); b.vy*=Math.pow(Config.FRICTION,dt*60);
    Holes.forEach(h=>{ const dx=h.x-b.x,dy=h.y-b.y,d=Math.hypot(dx,dy); if(d<h.r*2.5){ b.vx+=(dx/d)*Config.HOLE_PULL; b.vy+=(dy/d)*Config.HOLE_PULL; } if(d<h.r*.85){ b.alive=false; AudioFX.elim(); spawnParticles(b.x,b.y,b.color,20); } });
    if(!b.alive)return;
    b.x+=b.vx*dt*60; b.y+=b.vy*dt*60;
    const adx=b.x-Arena.cx,ady=b.y-Arena.cy, adist=Math.hypot(adx,ady), maxR=Arena.radius-b.r;
    if(adist>maxR){ const nx=adx/adist,ny=ady/adist; b.x=Arena.cx+nx*maxR; b.y=Arena.cy+ny*maxR; const dot=b.vx*nx+b.vy*ny; if(dot>0){b.vx-=1.8*dot*nx;b.vy-=1.8*dot*ny} }
  });
  for(let i=0;i<Balls.length;i++){ if(!Balls[i].alive)continue; for(let j=i+1;j<Balls.length;j++){ if(!Balls[j].alive)continue; const b1=Balls[i],b2=Balls[j],dx=b2.x-b1.x,dy=b2.y-b1.y,d=Math.hypot(dx,dy); if(d<b1.r+b2.r){ const nx=dx/d,ny=dy/d,ov=(b1.r+b2.r-d)/2; b1.x-=nx*ov;b1.y-=ny*ov;b2.x+=nx*ov;b2.y+=ny*ov; const kx=b1.vx-b2.vx,ky=b1.vy-b2.vy,p=(nx*kx+ny*ky); b1.vx-=p*nx*.95;b1.vy-=p*ny*.95;b2.vx+=p*nx*.95;b2.vy+=p*ny*.95; if(Math.hypot(kx,ky)>8){ScreenShake=10;AudioFX.hit();spawnParticles((b1.x+b2.x)/2,(b1.y+b2.y)/2,'#fff',5);} } } }
  for(let i=Particles.length-1;i>=0;i--){ let p=Particles[i]; p.x+=p.vx;p.y+=p.vy;p.life-=0.02; if(p.life<=0)Particles.splice(i,1); }
  if(Balls.filter(b=>b.alive).length<=1){ CurrentState='LOBBY'; document.getElementById('startBtn').innerText='▶ ابدأ البث'; }
}
function spawnParticles(x,y,c,n){ for(let i=0;i<n&&Particles.length<200;i++){ const a=Math.random()*Math.PI*2,s=Math.random()*5+2; Particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color:c,life:1,size:Math.random()*4+1.5}); } }

function render(){
  const w=canvas.width/window.devicePixelRatio,h=canvas.height/window.devicePixelRatio;
  ctx.clearRect(0,0,w,h); ctx.save();
  if(ScreenShake>0){ctx.translate((Math.random()-.5)*ScreenShake,(Math.random()-.5)*ScreenShake);ScreenShake*=.9;if(ScreenShake<.5)ScreenShake=0;}
  ctx.beginPath();ctx.arc(Arena.cx,Arena.cy,Arena.radius,0,Math.PI*2);ctx.fillStyle='#060b13';ctx.fill();
  ctx.strokeStyle='#d4af37';ctx.lineWidth=5;ctx.shadowColor='#d4af37';ctx.shadowBlur=25;ctx.stroke();ctx.shadowBlur=0;
  Holes.forEach(h=>{ let g=ctx.createRadialGradient(h.x,h.y,h.r*.2,h.x,h.y,h.r*1.5); g.addColorStop(0,'rgba(239,68,68,0.6)');g.addColorStop(1,'rgba(239,68,68,0)'); ctx.beginPath();ctx.arc(h.x,h.y,h.r*1.5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill(); ctx.beginPath();ctx.arc(h.x,h.y,h.r*.6,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();ctx.strokeStyle='#ef4444';ctx.stroke(); });
  Particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
  Balls.forEach(b=>{ if(!b.alive)return; ctx.save(); ctx.shadowColor=b.color;ctx.shadowBlur=b.isPlayer?20:12; ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();ctx.shadowBlur=0; if(b.isPlayer){ctx.beginPath();ctx.arc(b.x,b.y,b.r+4,0,Math.PI*2);ctx.strokeStyle='#d4af37';ctx.lineWidth=2.5;ctx.stroke();} ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(9,b.r*.75)}px Cairo`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.name,b.x,b.y); ctx.restore(); });
  ctx.restore();
}

function gameLoop(t){ const dt=Math.min((t-lastTime)/1000,.1);lastTime=t;updatePhysics(dt);render();requestAnimationFrame(gameLoop); }

// UI & Streamer Functions
function showToast(msg){ const c=document.getElementById('toastContainer'); const t=document.createElement('div'); t.className='toast';t.innerText=msg;c.appendChild(t);setTimeout(()=>t.remove(),3000); }
function addChat(user,msg,isSuper=false){ const box=document.getElementById('liveChatBox'); const el=document.createElement('div'); el.className='chat-msg'; if(isSuper){el.style.borderColor='#d4af37';el.style.background='rgba(212,175,55,0.2)';} el.innerHTML=`<b>${user}</b>: ${msg}`; box.appendChild(el); if(box.children.length>10)box.firstChild.remove(); }

const GameEngine={
  startBattle(){ if(CurrentState==='BATTLE')return; AudioFX.click(); Balls=[]; createBall('قائد',true); const n=['الرياض','جدة','الدمام','مكة','المدينة']; n.forEach(name=>createBall(name,false)); CurrentState='BATTLE'; document.getElementById('startBtn').innerText='⚔️ البث مباشر'; },
  resetGame(){ CurrentState='LOBBY'; Balls=[];Particles=[]; ScreenShake=0;HitStop=0; document.getElementById('startBtn').innerText='▶ ابدأ البث'; }
};

// Streamer Commands (Mapped to Super Chat)
function triggerBlackHole(){
  AudioFX.bass(); showToast('☄️ سوبر شات: ثقب أسود!'); addChat('أبو فهد','أرسل 50$',true);
  ScreenShake=30; const bx=Arena.cx+(Math.random()-.5)*Arena.radius*.5, by=Arena.cy+(Math.random()-.5)*Arena.radius*.5;
  for(let i=0;i<50;i++)Particles.push({x:bx,y:by,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,life:2,color:'#a855f7',size:Math.random()*5+2});
  Balls.forEach(b=>{ if(!b.alive)return; const dx=bx-b.x,dy=by-b.y,d=Math.hypot(dx,dy); if(d>0){b.vx+=(dx/d)*25;b.vy+=(dy/d)*25;} });
  document.getElementById('chaosMeter').style.width='80%';
}
function triggerLightning(){
  AudioFX.play(1000,'sawtooth',.5,.2); showToast('⚡ سوبر شات: صاعقة!'); addChat('سلطان','أرسل 20$',true);
  ScreenShake=20; const a=Balls.filter(b=>b.alive); if(a.length>0){ const t=a[Math.floor(Math.random()*a.length)]; const ang=Math.random()*Math.PI*2; t.vx=Math.cos(ang)*30;t.vy=Math.sin(ang)*30; for(let i=0;i<30;i++)Particles.push({x:t.x,y:t.y,vx:(Math.random()-.5)*15,vy:(Math.random()-.5)*15,life:1.5,color:'#38bdf8',size:Math.random()*3+1}); }
  document.getElementById('chaosMeter').style.width='50%';
}
function triggerWhaleDrop(name){
  AudioFX.win(); showToast('💰 مطر ذهب من '+name); addChat(name,'أرسل 5$',true);
  for(let i=0;i<150;i++)Particles.push({x:Math.random()*Arena.radius*2+(Arena.cx-Arena.radius),y:-20,vx:(Math.random()-.5)*4,vy:Math.random()*8+4,life:2,color:'#d4af37',size:Math.random()*4+2});
  const a=Balls.filter(b=>b.alive); if(a.length>0){ const t=a[Math.floor(Math.random()*a.length)]; t.vx*=2;t.vy*=2; }
  document.getElementById('chaosMeter').style.width='35%';
}

// Fake Goal Bar Simulation (In real life, connect to YouTube API)
let likes = 0;
setInterval(() => {
  if(CurrentState === 'BATTLE') {
    likes += Math.floor(Math.random() * 50); // Simulate incoming likes
    let percent = Math.min(100, (likes / 1000) * 100);
    document.getElementById('goalProgress').style.width = percent + '%';
    document.getElementById('goalText').innerText = `الهدف القادم: قنبلة الفيزياء عند 1000 لايك (${likes}/1000)`;
    
    if (likes >= 1000) {
      // MEGA BOMB!
      AudioFX.bass();
      showToast('💥 قنبلة الفيزياء! تم الوصول لـ 1000 لايك!');
      ScreenShake = 50;
      Balls.forEach(b => { b.vx *= -3; b.vy *= -3; }); // Explode everything
      likes = 0; // Reset
      document.getElementById('goalProgress').style.width = '0%';
    }
  }
}, 2000);

function boot(){ resizeCanvas(); addChat('يوتيوب','مرحباً بكم في البث المباشر!',false); addChat('النظام','الهدف: 1000 لايك لتفجير الحلبة',false); requestAnimationFrame(gameLoop); }
window.onload=boot;
</script>
</body>
</html>
