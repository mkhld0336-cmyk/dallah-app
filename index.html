<!DOCTYPE html>

<title>ديربي القبائل | Tribes Arena</title>

<style>
:root{
  --gold:#d4af37;--gold-light:#f2d77a;--bg:#0b0b0d;--bg-2:#12141a;
  --surface:rgba(20,22,28,.85);--border:rgba(212,175,55,.25);
  --text:#f4efe1;--text-dim:#a9adaf;--danger:#ff3b3b;
  --success:#00ff88;--cyan:#00e5ff;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Cairo',system-ui,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none}
#screen-flash{position:fixed;inset:0;background:red;opacity:0;
  pointer-events:none;z-index:9999}
#screen-flash.active{animation:redFlash .35s ease-out}
@keyframes redFlash{0%{opacity:.6}100%{opacity:0}}
.shake-screen{animation:shakeScreen .4s}
@keyframes shakeScreen{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-6px,3px)}
  40%{transform:translate(6px,-3px)}
  60%{transform:translate(-3px,6px)}
  80%{transform:translate(3px,-6px)}
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;
  max-width:640px;margin:0 auto;position:relative}
.top-bar{display:flex;justify-content:space-around;align-items:center;
  padding:10px 10px;background:var(--surface);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);z-index:10;gap:6px}
.stat{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.stat-value{color:var(--gold);font-size:15px;min-width:36px;text-align:center;
  font-variant-numeric:tabular-nums}
.arena-wrapper{position:relative;flex:1 1 auto;min-height:0;
  background:radial-gradient(ellipse at center,#141a25 0%,#05070a 100%);
  overflow:hidden;touch-action:none}
#arena{display:block;position:absolute;inset:0;width:100%;height:100%}
.status-overlay{position:absolute;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.75);color:var(--gold);padding:6px 18px;
  border-radius:100px;font-size:13px;font-weight:700;border:1px solid var(--border);
  backdrop-filter:blur(10px);white-space:nowrap;z-index:5;transition:.3s}
.status-overlay.danger{color:var(--danger);border-color:var(--danger);
  animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.06)}}
/* REMAINING */
.remaining-hero{position:absolute;top:48px;right:10px;
  background:linear-gradient(135deg,rgba(0,0,0,.9),rgba(20,22,28,.9));
  border:1.5px solid var(--gold);border-radius:100px;
  padding:5px 14px;font-size:16px;font-weight:900;color:var(--gold);
  z-index:7;font-variant-numeric:tabular-nums;
  box-shadow:0 0 22px rgba(212,175,55,.35)}
.remaining-hero.pulse{animation:heroPulse .4s ease-out}
@keyframes heroPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18);color:#ff3b3b}}
.remaining-hero.danger{color:#ff3b3b;border-color:#ff3b3b;animation:dangerBlink 1s infinite}
@keyframes dangerBlink{0%,100%{box-shadow:0 0 22px rgba(255,59,59,.5)}
  50%{box-shadow:0 0 40px rgba(255,59,59,.9)}}
.remaining-sep{opacity:.5;margin:0 3px}
/* KILL FEED */
.kill-feed{position:absolute;top:90px;right:10px;
  display:flex;flex-direction:column;gap:4px;
  pointer-events:none;z-index:6;max-width:130px}
.kf-item{background:rgba(0,0,0,.8);border:1px solid rgba(255,59,59,.5);
  color:#fff;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;
  animation:kfIn .25s ease-out,kfOut .3s ease-in 2.5s forwards;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes kfIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes kfOut{to{opacity:0;transform:translateX(20px)}}
/* FINAL BANNER (10/5/3) */
.final-banner{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:clamp(30px,9vw,56px);font-weight:900;
  text-shadow:0 0 25px currentColor,0 0 50px currentColor;
  z-index:15;pointer-events:none;opacity:0;font-family:'Cairo',sans-serif}
.final-banner.show{animation:phaseZoom 2.2s ease-out}
@keyframes phaseZoom{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0}
  15%{transform:translate(-50%,-50%) scale(1.35);opacity:1}
  30%{transform:translate(-50%,-50%) scale(1);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(.85);opacity:0}
}
/* FINAL DUEL */
.final-duel{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:radial-gradient(ellipse at center,rgba(40,0,0,.9) 0%,rgba(0,0,0,.97) 100%);
  backdrop-filter:blur(6px);z-index:18;opacity:0;pointer-events:none;
  transition:opacity .4s ease}
.final-duel.show{opacity:1}
.duel-title{font-size:clamp(26px,8vw,48px);font-weight:900;color:#ff3b3b;
  text-shadow:0 0 30px #ff3b3b,0 0 60px #ff0000;margin-bottom:clamp(20px,5vw,32px);
  letter-spacing:2px;animation:duelPulse 1s infinite}
@keyframes duelPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.duel-fighters{display:flex;align-items:center;gap:clamp(12px,4vw,36px)}
.duel-fighter{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:clamp(12px,4vw,20px) clamp(16px,5vw,28px);
  background:rgba(20,22,28,.95);border:2px solid var(--gold);border-radius:16px;
  box-shadow:0 0 25px rgba(212,175,55,.5);min-width:clamp(90px,25vw,130px)}
.duel-emoji{font-size:clamp(36px,11vw,64px);line-height:1}
.duel-name{font-size:clamp(14px,4vw,20px);font-weight:900;color:#fff;text-align:center}
.duel-vs{font-size:clamp(22px,7vw,40px);font-weight:900;color:#ff3b3b;
  text-shadow:0 0 20px #ff3b3b;animation:duelPulse .8s infinite}
/* FINAL PILL */
.final-pill{position:absolute;bottom:8px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:linear-gradient(135deg,rgba(0,0,0,.92),rgba(40,10,10,.92));
  border:1.5px solid #ff3b3b;border-radius:100px;padding:5px 16px;
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#fff;
  z-index:7;opacity:0;pointer-events:none;transition:.3s;
  box-shadow:0 0 20px rgba(255,59,59,.5)}
.final-pill.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pill-vs{color:#ff3b3b;font-size:14px}
/* WINNER */
.winner-banner{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:#1a1400;padding:20px 40px;border-radius:20px;text-align:center;
  box-shadow:0 0 60px rgba(212,175,55,.7);z-index:20;
  transition:transform .5s cubic-bezier(.2,1.5,.3,1)}
.winner-banner.show{transform:translate(-50%,-50%) scale(1)}
.winner-emoji{font-size:48px;line-height:1}
.winner-name{font-size:22px;font-weight:900;margin-top:6px}
.winner-sub{font-size:12px;opacity:.8;margin-top:4px}
/* CONTROLS */
.controls{padding:10px 12px;background:var(--surface);
  border-top:1px solid var(--border);z-index:10}
.btn-primary{width:100%;padding:14px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:#1a1400;border:none;border-radius:var(--radius);
  font-family:'Cairo',sans-serif;font-size:16px;font-weight:900;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 4px 20px rgba(212,175,55,.35)}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* CHAT */
.chat-panel{background:var(--surface);border-top:1px solid var(--border);
  padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px;z-index:10}
.chat-history{overflow-y:auto;max-height:12vh;display:flex;
  flex-direction:column;gap:3px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.chat-history::-webkit-scrollbar{width:3px}
.chat-history::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
.chat-msg{font-size:11.5px;line-height:1.4;padding:3px 8px;border-radius:8px;
  background:rgba(30,32,40,.6);display:flex;gap:6px;animation:slideIn .2s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.chat-prefix{flex-shrink:0}
.chat-text{color:var(--text-dim);word-break:break-word}
.chat-input-row{display:flex;gap:8px}
#chat-input{flex:1;padding:11px 16px;background:rgba(255,255,255,.06);
  border:1px solid var(--border);border-radius:100px;color:var(--text);
  font-family:'Cairo',sans-serif;font-size:14px;outline:none;transition:.2s}
#chat-input:focus{border-color:var(--gold);background:rgba(212,175,55,.08)}
#chat-input::placeholder{color:#666}
.btn-send{width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  color:#1a1400;border:none;font-size:20px;font-weight:900;cursor:pointer;
  display:grid;place-items:center;transition:transform .15s;flex-shrink:0}
.btn-send:active{transform:scale(.9)}
</style>
</head>

['🇸🇰','SK','سلوفاكيا'],['🇱🇹','LT','ليتوانيا'],['🇱🇻','LV','لاتفيا'],['🇪🇪','EE','إستونيا']

class PhysicsWorld {
  constructor(radius) {
    this.arenaRadius = radius;
    this.balls = [];
    this.nextId = 1;
  }
  addBall(cfg) {
    const b = {
      id: this.nextId++,
      name: cfg.name, emoji: cfg.emoji, iso: cfg.iso,
      x: cfg.x || 0, y: cfg.y || 0,
      vx: cfg.vx || 0, vy: cfg.vy || 0,
      radius: cfg.radius, mass: cfg.mass,
      color: cfg.color, alive: true,
      votes: 0, isSuper: cfg.isSuper || false
    };
    this.balls.push(b);
    return b;
  }
  applyVoteBoost(id, isSuper) {
    const b = this.balls.find(x => x.id === id);
    if (!b || !b.alive) return false;
    const ang = Math.atan2(-b.y, -b.x) + (Math.random() - .5) * 1.2;
    const imp = isSuper ? 4 : CONFIG.VOTE_BOOST_IMPULSE;
    b.vx += Math.cos(ang) * imp;
    b.vy += Math.sin(ang) * imp;
    b.votes += isSuper ? 5 : 1;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > CONFIG.MAX_BALL_SPEED) {
      b.vx = (b.vx / sp) * CONFIG.MAX_BALL_SPEED;
      b.vy = (b.vy / sp) * CONFIG.MAX_BALL_SPEED;
    }
    return true;
  }
  update(dt, eliminateMode) {
    const justDied = [];
    // Motion
    for (const b of this.balls) {
      if (!b.alive) continue;
      b.vx *= CONFIG.FRICTION;
      b.vy *= CONFIG.FRICTION;
      b.x += b.vx;
      b.y += b.vy;
    }
    // Ball-ball collisions
    const alive = this.balls.filter(b => b.alive);
    for (let i = 0; i < alive.length; i++) {
      for (let j = i + 1; j < alive.length; j++) {
        this.resolve(alive[i], alive[j]);
      }
    }
    // Wall / elimination
    for (const b of this.balls) {
      if (!b.alive) continue;
      const d = Math.hypot(b.x, b.y);
      const maxDist = this.arenaRadius - b.radius;
      if (d > maxDist && d > 0) {
        if (eliminateMode) {
          b.alive = false;
          justDied.push(b);
          continue;
        }
        const nx = b.x / d, ny = b.y / d;
        b.x = nx * maxDist;
        b.y = ny * maxDist;
        const dot = b.vx * nx + b.vy * ny;
        b.vx -= 2 * dot * nx * CONFIG.WALL_RESTITUTION;
        b.vy -= 2 * dot * ny * CONFIG.WALL_RESTITUTION;
      }
    }
    return justDied;
  }
  resolve(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const minD = a.radius + b.radius;
    if (dist >= minD || dist === 0) return;
    const nx = dx / dist, ny = dy / dist;
    const overlap = minD - dist;
    const tm = a.mass + b.mass;
    a.x -= nx * overlap * (b.mass / tm); a.y -= ny * overlap * (b.mass / tm);
    b.x += nx * overlap * (a.mass / tm); b.y += ny * overlap * (a.mass / tm);
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn > 0) return;
    const j = -(1 + CONFIG.BALL_RESTITUTION) * vn / (1 / a.mass + 1 / b.mass);
    a.vx -= (j * nx) / a.mass; a.vy -= (j * ny) / a.mass;
    b.vx += (j * nx) / b.mass; b.vy += (j * ny) / b.mass;
  }
  getAlive() { return this.balls.filter(b => b.alive); }
  getWinner() { const a = this.getAlive(); return a.length === 1 ? a[0] : null; }
}

class AudioEngine {
  constructor() { this.ctx = null; this.enabled = true; this.vol = .3; }
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { this.enabled = false; }
  }
  _tone(freq, dur, type = 'sine', gain = .1) {
    if (!this.enabled || !this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain * this.vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime + dur);
  }
  vote() { this._tone(660, .1, 'sine', .15); }
  eliminate() {
    if (this._lastElimSound && Date.now() - this._lastElimSound < 250) return;
    this._lastElimSound = Date.now();
    this._tone(220, .2, 'sawtooth', .3);
    setTimeout(() => this._tone(120, .3, 'triangle', .25), 100);
  }
  finalDuel() { this._tone(440, .15, 'square', .15);
    setTimeout(() => this._tone(880, .25, 'square', .2), 150); }
  victory() {
    [523, 659, 784, 1047, 1318].forEach((f, i) =>
      setTimeout(() => this._tone(f, .35, 'triangle', .25), i * 120));
  }
  click() { this._tone(440, .05, 'square', .05); }
}

const Storage = {
  save(k, d) { try { localStorage.setItem(k, JSON.stringify(d)); } catch (e) {} },
  load(k, fb = {}) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch (e) { return fb; } },
  getCooldowns() { return this.load(CONFIG.SK_VOTES, {}); },
  canVote(iso) { return Date.now() - (this.getCooldowns()[iso] || 0) >= CONFIG.VOTE_COOLDOWN_MS; },
  recordVote(iso) {
    const c = this.getCooldowns(); c[iso] = Date.now();
    const cutoff = Date.now() - 60000;
    for (const k in c) if (c[k] < cutoff) delete c[k];
    this.save(CONFIG.SK_VOTES, c);
  },
  getLB() { return this.load(CONFIG.SK_LB, {}); },
  recordWin(iso, name, emoji) {
    const lb = this.getLB();
    if (!lb[iso]) lb[iso] = { name, emoji, iso, wins: 0 };
    lb[iso].wins += 1;
    this.save(CONFIG.SK_LB, lb);
  }
};

class Game {
  constructor() {
    this.canvas = document.getElementById('arena');
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.physics = null;
    this.arenaRadius = CONFIG.ARENA_INITIAL_RADIUS;
    this.state = 'IDLE';
    this.startTime = 0;
    this.cycle = 0;
    this.lastTick = performance.now();
    this.audio = new AudioEngine();
    this.voteTotal = 0;
    this.lastAliveCount = -1;
    this.timeScale = 1;
    this._phaseShown = {};
    this.elimQueue = [];
    this.processingElim = false;
    this.els = {
      status: document.getElementById('status-text'),
      timer: document.getElementById('timer'),
      alive: document.getElementById('alive-count'),
      cycle: document.getElementById('cycle'),
      vote: document.getElementById('vote-count'),
      start: document.getElementById('start-btn'),
      chatInput: document.getElementById('chat-input'),
      chatSend: document.getElementById('chat-send'),
      chatHistory: document.getElementById('chat-history'),
      winnerBanner: document.getElementById('winner-banner'),
      winnerName: document.getElementById('winner-name'),
      remainingHero: document.getElementById('remaining-hero'),
      remainingCurrent: document.getElementById('remaining-current'),
      remainingMax: document.getElementById('remaining-max'),
      killFeed: document.getElementById('kill-feed'),
      finalBanner: document.getElementById('final-banner'),
      finalDuel: document.getElementById('final-duel'),
      finalPill: document.getElementById('final-pill'),
      duelLeft: document.getElementById('duel-left'),
      duelRight: document.getElementById('duel-right'),
      pillLeft: document.getElementById('pill-left'),
      pillRight: document.getElementById('pill-right'),
      screenFlash: document.getElementById('screen-flash'),
      app: document.getElementById('app')
    };
    this.resize();
    this.bindUI();
    this.physics = new PhysicsWorld(this.arenaRadius);
    requestAnimationFrame(t => this.loop(t));
  }
  resize() {
    const wrap = this.canvas.parentElement;
    const rect = wrap.getBoundingClientRect();
    this.width = rect.width; this.height = rect.height;
    this.canvas.width = Math.floor(rect.width * this.dpr);
    this.canvas.height = Math.floor(rect.height * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.cx = this.width / 2; this.cy = this.height / 2;
    this.scale = Math.min(this.width, this.height) / (CONFIG.ARENA_INITIAL_RADIUS * 2.2);
  }
  bindUI() {
    window.addEventListener('resize', () => this.resize());
    this.els.start.addEventListener('click', () => {
      this.audio.init(); this.audio.click(); this.startBattle();
    });
    this.els.chatSend.addEventListener('click', () => this.handleChat());
    this.els.chatInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') this.handleChat();
    });
  }
  pickColor(i) {
    const pal = ['#00e5ff','#ff0055','#00ff88','#ffaa00','#8a2be2',
      '#ff4500','#1e90ff','#32cd32','#ff69b4','#dda0dd',
      '#ffd700','#40e0d0','#dc143c','#7fffd4','#ff6347',
      '#9370db','#20b2aa','#ffb6c1','#3cb371','#f08080'];
    return pal[i % pal.length];
  }
  startBattle() {
    this.cycle++;
    this.els.cycle.textContent = this.cycle;
    this.state = 'PREPARING';
    this.els.status.textContent = 'جاري التحضير...';
    this.els.status.classList.remove('danger');
    this.els.start.disabled = true;
    this.els.winnerBanner.classList.remove('show');
    this.els.remainingHero.classList.remove('danger');
    this._hideFinalDuel();
    this.els.killFeed.innerHTML = '';
    this._phaseShown = {};
    this.lastAliveCount = -1;
    this.timeScale = 1;
    this.elimQueue = [];
    this.processingElim = false;
    if (this._phaseTimer) clearTimeout(this._phaseTimer);

    // Pick 64: Saudi ALWAYS + 63 random others
    const others = COUNTRIES.filter(c => c[1] !== 'SA');
    for (let i = others.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [others[i], others[j]] = [others[j], others[i]];
    }
    const chosen = [COUNTRIES.find(c => c[1] === 'SA'), ...others.slice(0, CONFIG.MAX_BALLS - 1)];

    this.physics = new PhysicsWorld(CONFIG.ARENA_INITIAL_RADIUS);
    this.arenaRadius = CONFIG.ARENA_INITIAL_RADIUS;
    this.voteTotal = 0;
    this.els.vote.textContent = 0;

    chosen.forEach((c, i) => {
      const ang = (i / chosen.length) * Math.PI * 2;
      const r = 60 + Math.random() * 120;
      this.physics.addBall({
        name: c[2], emoji: c[0], iso: c[1],
        x: Math.cos(ang) * r, y: Math.sin(ang) * r,
        vx: (Math.random() - .5) * 3, vy: (Math.random() - .5) * 3,
        radius: CONFIG.BALL_RADIUS, mass: CONFIG.BALL_MASS,
        color: this.pickColor(i), isSuper: false
      });
    });

    this.els.remainingMax.textContent = chosen.length;
    this.els.remainingCurrent.textContent = chosen.length;

    this.addChat('🤖', `بدأت المعركة #${this.cycle} بـ ${chosen.length} دولة`);
    this.addChat('💡', 'اكتب اسم دولة للتصويت لها (السعودية مضمونة)');

    this.startTime = performance.now();
    this.lastTick = this.startTime;

    setTimeout(() => {
      if (this.state !== 'PREPARING') return;
      this.state = 'BATTLE';
      this.els.status.textContent = '⚔️ المعركة جارية';
      this.els.start.disabled = false;
      this.els.start.textContent = '🔄 معركة جديدة';
    }, 1200);
  }
  handleChat() {
    const text = this.els.chatInput.value.trim();
    if (!text) return;
    this.els.chatInput.value = '';
    this.audio.init();
    if (this.state !== 'BATTLE' && this.state !== 'SUDDEN_DEATH') {
      this.addChat('👤', `${text}: المعركة لم تبدأ بعد`);
      return;
    }
    const target = this.physics.balls.find(b => b.alive &&
      (b.name === text || b.name.includes(text) || b.iso === text.toUpperCase()));
    if (!target) {
      this.addChat('👤', `"${text}" ليس في هذه الجولة`);
      return;
    }
    if (!Storage.canVote(target.iso)) {
      this.addChat('⏳', 'انتظر 3 ثوانٍ قبل التصويت مجدداً');
      return;
    }
    this.physics.applyVoteBoost(target.id, false);
    Storage.recordVote(target.iso);
    this.audio.vote();
    this.voteTotal++;
    this.els.vote.textContent = this.voteTotal;
    this.addChat('⚡', `دعم ${target.emoji} ${target.name}`);
  }
  addChat(prefix, text) {
    const m = document.createElement('div');
    m.className = 'chat-msg';
    m.innerHTML = `<span class="chat-prefix">${prefix}</span><span class="chat-text">${this._esc(text)}</span>`;
    this.els.chatHistory.prepend(m);
    while (this.els.chatHistory.children.length > CONFIG.MAX_CHAT_HISTORY) {
      this.els.chatHistory.lastChild.remove();
    }
  }
  _esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  
  enqueueElimination(ball) {
    if (this.state === 'FINISHED') return;
    this.elimQueue.push(ball);
    if (!this.processingElim) this._drainElimQueue();
  }
  _drainElimQueue() {
    if (this.elimQueue.length === 0) { this.processingElim = false; return; }
    this.processingElim = true;
    const ball = this.elimQueue.shift();
    this._showKillFeed(ball);
    this.audio.eliminate();
    this.screenImpact();
    requestAnimationFrame(() => setTimeout(() => this._drainElimQueue(), 250));
  }
  _showKillFeed(ball) {
    const item = document.createElement('div');
    item.className = 'kf-item';
    item.textContent = `☠️ ${ball.emoji} ${ball.name}`;
    this.els.killFeed.prepend(item);
    while (this.els.killFeed.children.length > 4) this.els.killFeed.lastChild.remove();
    setTimeout(() => item.remove(), 3000);
  }
  screenImpact() {
    const flash = this.els.screenFlash;
    flash.classList.remove('active');
    void flash.offsetWidth;
    flash.classList.add('active');
    this.els.app.classList.add('shake-screen');
    setTimeout(() => this.els.app.classList.remove('shake-screen'), 400);
  }
  _updateRemaining(n) {
    this.els.remainingCurrent.textContent = n;
    this.els.remainingHero.classList.remove('pulse');
    void this.els.remainingHero.offsetWidth;
    this.els.remainingHero.classList.add('pulse');
    if (n <= 5) this.els.remainingHero.classList.add('danger');
    else this.els.remainingHero.classList.remove('danger');
  }
  _checkFinalPhases(n) {
    if (n <= 2 && !this._phaseShown.p2) {
      this._phaseShown.p2 = true;
      this._showFinalDuel(this.physics.getAlive());
      this._showPhase('👑 FINAL DUEL', '#ff3b3b', 0.3, 5000);
      this.audio.finalDuel();
      return;
    }
    if (n <= 3 && !this._phaseShown.p3) {
      this._phaseShown.p3 = true;
      this._showPhase('⚠️ FINAL 3', '#ff3b3b', 0.35, 4000);
    } else if (n <= 5 && !this._phaseShown.p5) {
      this._phaseShown.p5 = true;
      this._showPhase('🔥 FINAL 5', '#ff8c00', 0.5, 3000);
    } else if (n <= 10 && !this._phaseShown.p10) {
      this._phaseShown.p10 = true;
      this._showPhase('🔥 FINAL 10', '#ffd700', 0.7, 3000);
    }
  }
  _showPhase(text, color, scale, dur) {
    const el = this.els.finalBanner;
    el.textContent = text;
    el.style.color = color;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    this.timeScale = scale;
    if (this._phaseTimer) clearTimeout(this._phaseTimer);
    this._phaseTimer = setTimeout(() => { this.timeScale = 1; }, dur);
  }
  _showFinalDuel(balls) {
    if (balls.length !== 2) return;
    const [a, b] = balls;
    this.els.duelLeft.querySelector('.duel-emoji').textContent = a.emoji;
    this.els.duelLeft.querySelector('.duel-name').textContent = a.name;
    this.els.duelRight.querySelector('.duel-emoji').textContent = b.emoji;
    this.els.duelRight.querySelector('.duel-name').textContent = b.name;
    this.els.pillLeft.textContent = `${a.emoji} ${a.name}`;
    this.els.pillRight.textContent = `${b.emoji} ${b.name}`;
    this.els.finalDuel.classList.add('show');
    if (this._duelTimer) clearTimeout(this._duelTimer);
    this._duelTimer = setTimeout(() => {
      this.els.finalDuel.classList.remove('show');
      setTimeout(() => this.els.finalPill.classList.add('show'), 400);
    }, 3000);
  }
  _hideFinalDuel() {
    if (this._duelTimer) clearTimeout(this._duelTimer);
    this.els.finalDuel.classList.remove('show');
    this.els.finalPill.classList.remove('show');
  }
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    const dt = Math.min((now - this.lastTick) / 1000, 1 / 30);
    this.lastTick = now;
    const effectiveDt = dt * this.timeScale;

    if (this.state === 'BATTLE' || this.state === 'SUDDEN_DEATH') {
      const elapsed = now - this.startTime;
      const isSudden = elapsed > CONFIG.SUDDEN_DEATH_AFTER_MS;
      
      // Shrink arena (real time, not scaled)
      const shrinkRate = isSudden ? CONFIG.ARENA_SUDDEN_SHRINK : CONFIG.ARENA_SHRINK_RATE;
      if (this.arenaRadius > CONFIG.ARENA_MIN_RADIUS) {
        this.arenaRadius = Math.max(CONFIG.ARENA_MIN_RADIUS, this.arenaRadius - shrinkRate * dt);
      }
      this.physics.arenaRadius = this.arenaRadius;

      // Physics
      const eliminateMode = this.arenaRadius < CONFIG.ELIMINATION_THRESHOLD;
      const eliminated = this.physics.update(effectiveDt, eliminateMode);
      for (const b of eliminated) this.enqueueElimination(b);

      // Timer
      const remaining = Math.max(0, CONFIG.ROUND_DURATION_MS - elapsed);
      this.els.timer.textContent = this._fmt(remaining);

      // Update count
      const aliveN = this.physics.getAlive().length;
      if (aliveN !== this.lastAliveCount) {
        this.lastAliveCount = aliveN;
        this.els.alive.textContent = aliveN;
        this._updateRemaining(aliveN);
        this._checkFinalPhases(aliveN);
      }

      // Phase transition
      if (this.state === 'BATTLE' && isSudden) {
        this.state = 'SUDDEN_DEATH';
        this.els.status.textContent = '⏱️ الموت المفاجئ — الحلبة تتقلص!';
        this.els.status.classList.add('danger');
        this.addChat('⚠️', 'بدأت المرحلة الحرجة!');
      }

      // End
      if (aliveN <= 1 || remaining <= 0) this.endBattle();
    }
    this.render(now);
  }
  _fmt(ms) {
    const s = Math.ceil(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  endBattle() {
    this._hideFinalDuel();
    this.elimQueue = [];
    this.processingElim = false;
    this.state = 'FINISHED';
    const w = this.physics.getWinner() || this.physics.getAlive()[0];
    if (w) {
      Storage.recordWin(w.iso, w.name, w.emoji);
      this.audio.victory();
      this.els.status.textContent = `🏆 الفائز: ${w.emoji} ${w.name}`;
      this.els.status.classList.remove('danger');
      this.els.winnerName.textContent = `${w.emoji} ${w.name}`;
      this.els.winnerBanner.classList.add('show');
      this.addChat('🏆', `الفائز: ${w.emoji} ${w.name}!`);
      this.confetti();
    } else {
      this.els.status.textContent = 'انتهت المعركة';
    }
    this.els.start.disabled = true;
    setTimeout(() => {
      this.els.start.disabled = false;
      this.els.start.textContent = '🎮 ابدأ معركة جديدة';
      this.els.winnerBanner.classList.remove('show');
    }, 3500);
  }
  confetti() {
    const colors = [CONFIG.GOLD, '#00e5ff', '#ff0055', '#00ff88'];
    const parts = [];
    for (let i = 0; i < 120; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 4 + Math.random() * 10;
      parts.push({
        x: this.cx, y: this.cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1, size: 2 + Math.random() * 3
      });
    }
    const animate = () => {
      let any = false;
      for (const p of parts) {
        if (p.life <= 0) continue;
        p.x += p.vx; p.y += p.vy; p.vy += .25; p.life -= .012;
        if (p.life > 0) {
          any = true;
          this.ctx.save();
          this.ctx.globalAlpha = p.life;
          this.ctx.fillStyle = p.color;
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          this.ctx.fill();
          this.ctx.restore();
        }
      }
      if (any) requestAnimationFrame(animate);
    };
    animate();
  }
  render(now) {
    const ctx = this.ctx;
    ctx.fillStyle = CONFIG.BG || '#0b0b0d';
    ctx.fillRect(0, 0, this.width, this.height);
    const cx = this.cx, cy = this.cy;
    const rPix = this.arenaRadius * this.scale;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rPix);
    grad.addColorStop(0, 'rgba(0,229,255,.15)');
    grad.addColorStop(.7, 'rgba(0,100,150,.05)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, rPix, 0, Math.PI * 2); ctx.fill();
    const isDanger = this.state === 'SUDDEN_DEATH';
    ctx.strokeStyle = isDanger ? '#ff3b3b' : CONFIG.GOLD === '#d4af37' ? '#00e5ff' : '#00e5ff';
    ctx.lineWidth = 4;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = isDanger ? 30 : 20;
    ctx.beginPath(); ctx.arc(cx, cy, rPix, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(now * .0002);
    ctx.strokeStyle = 'rgba(0,229,255,.12)'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.moveTo(rPix * .3, 0); ctx.lineTo(rPix * .72, 0); ctx.stroke();
    }
    ctx.restore();
    if (!this.physics) return;
    for (const b of this.physics.balls) {
      if (!b.alive) continue;
      const bx = cx + b.x * this.scale;
      const by = cy + b.y * this.scale;
      const br = b.radius * this.scale;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = b.isSuper ? 22 : 10;
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = b.isSuper ? CONFIG.GOLD : 'rgba(255,255,255,.5)';
      ctx.lineWidth = b.isSuper ? 3 : 1.2;
      ctx.stroke();
      if (br > 6) {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(9, Math.floor(br * .85))}px Cairo`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.emoji || b.name, bx, by - br * .1);
      }
    }
  }
}

window.addEventListener('DOMContentLoaded', () => {
  window.__game = new Game();
});

})();
